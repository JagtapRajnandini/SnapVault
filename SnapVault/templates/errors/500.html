{% extends "base.html" %}

{% block title %}Server Error — SnapVault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 text-center py-5">

        <div class="mb-4">
            <i class="bi bi-gear display-1 text-danger"></i>
        </div>

        <h1 class="display-4 fw-bold text-dark mb-2">500</h1>
        <h2 class="h5 text-muted mb-3">Internal Server Error</h2>

        <p class="text-muted mb-4">
            Something went wrong on our end. Please try again later.
            If the problem persists, contact the administrator.
        </p>

        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('home_page') }}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Go Home
            </a>
            <a href="javascript:location.reload();" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-clockwise me-1"></i>Try Again
            </a>
        </div>

    </div>
</div>
{% endblock %}
