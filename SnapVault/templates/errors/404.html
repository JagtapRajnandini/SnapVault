{% extends "base.html" %}

{% block title %}Page Not Found — SnapVault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 text-center py-5">

        <div class="mb-4">
            <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
        </div>

        <h1 class="display-4 fw-bold text-dark mb-2">404</h1>
        <h2 class="h5 text-muted mb-3">Page Not Found</h2>

        <p class="text-muted mb-4">
            The page you are looking for doesn't exist or has been moved.
        </p>

        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('home_page') }}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Go Home
            </a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard_page') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-speedometer2 me-1"></i>Dashboard
                </a>
            {% endif %}
        </div>

    </div>
</div>
{% endblock %}
